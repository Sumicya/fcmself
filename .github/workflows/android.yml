# 建议的 CI 配置（需要手动覆盖到 .github/workflows/android.yml）
#
# 为什么单独放一个文件：Arena 侧使用的 GitHub App 没有 `workflows` 权限，
# 推送 .github/workflows/* 会被远端拒绝
# （"refusing to allow a GitHub App to create or update workflow ... without workflows permission"）。
#
# 用法：
#   cp docs/android.yml.suggested .github/workflows/android.yml
#
# 这一版是「零 secrets」配置：仓库不需要配置任何签名密钥/发布 token。
# CI 只做两件事——编译，以及上传两个产物：
#   - fcmself-<版本>-debug-signed.apk ：debug 签名，可直接安装测试
#   - fcmself-<版本>-unsigned.apk     ：release 未签名，本地用 apksigner 签
# 本地签名步骤见 docs/build-and-sign-termux.md。
#
# 相对现有 workflow 的改动：
#   1.【必须】单变体：产物是 app-release-unsigned.apk / app-debug.apk，
#      不再有 app-full- / app-lite- 前缀，原来的两条 mv 会直接失败
#   2. 删除 Sign APK / Rename / Release / LSPosed 仓库推送等依赖 secrets 的步骤
#      （实测 run 33964336726：编译已通过，Sign APK 用 build-tools 37.0.0 的 apksigner
#       以 exit code 2 失败；仓库未配置 SIGNINGKEYBASE64 等 secrets，空 keystore 是最可能的原因）
#   3. 增加 pull_request 触发，合并前就能跑 CI（原来只有 push 到 master 才跑）
#   4. 构建失败时把日志尾部写进 job summary，并在 PR 上贴评论
#      （Actions 日志文件在 blob.core.windows.net、job summary 也不在 check-run 的 output 里，
#       受限网络下都读不到；PR 评论可以通过 api.github.com 读取）

name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 构建失败时需要往 PR 贴日志评论
      pull-requests: write
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Retrieve version name
      run: echo "VERSION_NAME=$(date "+%Y%m%d")_$(echo ${{ github.sha }} | head -c 7)" >> $GITHUB_ENV

    - name: Retrieve version code
      run: echo "VERSION_CODE=$(cat ${{ github.workspace }}/app/build.gradle | grep "versionCode" | grep -Eo "[0-9]+")" >> $GITHUB_ENV

    - name: Set version name
      run: sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION_NAME }}\"/" ${{ github.workspace }}/app/build.gradle

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        ./gradlew assembleRelease assembleDebug 2>&1 | tee build.log

    - name: Rename artifacts
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv release/app-release-unsigned.apk release/fcmself-${{ env.VERSION_NAME }}-unsigned.apk
        mv debug/app-debug.apk debug/fcmself-${{ env.VERSION_NAME }}-debug-signed.apk

    - name: Upload apks
      uses: actions/upload-artifact@v7
      with:
        name: fcmself-${{ env.VERSION_NAME }}
        path: |
          ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-${{ env.VERSION_NAME }}-unsigned.apk
          ${{ github.workspace }}/app/build/outputs/apk/debug/fcmself-${{ env.VERSION_NAME }}-debug-signed.apk

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Post build log tail to PR on failure
      if: failure() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail 120)'
          echo '```'
          tail -n 120 build.log
          echo '```'
        } > /tmp/build-log-tail.md
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file /tmp/build-log-tail.md
