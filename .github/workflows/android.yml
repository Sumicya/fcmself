# Android CI —— 「零 secrets」配置：仓库不需要任何签名密钥 / 发布 token。
# CI 只做三件事——跑单元测试、编译 debug + release 两个变体，以及上传两个产物：
#   - fcmself-<版本>-debug-signed.apk ：debug 签名，可直接安装测试
#   - fcmself-<版本>-unsigned.apk     ：release 未签名，本地用 apksigner 签
# 本地签名步骤见 docs/build-and-sign-termux.md。
#
# 要点：
#   1. 单变体：产物是 app-release-unsigned.apk / app-debug.apk
#   2. 先跑 ./gradlew test，参数下标解析的单元测试不过就不继续构建
#   3. 构建失败时把日志尾部写进 job summary，并在 PR 上贴评论
#   4. 触发 push 到 master 与 pull_request 到 master 两种事件

name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 构建失败时需要往 PR 贴日志评论
      pull-requests: write
    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Retrieve version name
      run: echo "VERSION_NAME=$(date "+%Y%m%d")_$(echo ${{ github.sha }} | head -c 7)" >> $GITHUB_ENV

    - name: Retrieve version code
      run: echo "VERSION_CODE=$(cat ${{ github.workspace }}/app/build.gradle | grep "versionCode" | grep -Eo "[0-9]+")" >> $GITHUB_ENV

    - name: Set version name
      run: sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION_NAME }}\"/" ${{ github.workspace }}/app/build.gradle

    - name: Build with Gradle
      shell: bash
      run: |
        set -o pipefail
        # test 放在最前：参数下标解析的单元测试不通过就不必继续构建
        ./gradlew test assembleRelease assembleDebug 2>&1 | tee build.log

    - name: Rename artifacts
      shell: bash
      run: |
        cd ${{ github.workspace }}/app/build/outputs/apk
        mv release/app-release-unsigned.apk release/fcmself-${{ env.VERSION_NAME }}-unsigned.apk
        mv debug/app-debug.apk debug/fcmself-${{ env.VERSION_NAME }}-debug-signed.apk

    - name: Run lint
      shell: bash
      # 放在上传之后：lint 报问题时 APK 已经产出，不会因为静态检查拿不到包
      run: ./gradlew lint

    - name: Verify R8 kept the Xposed entry class
      shell: bash
      run: |
        # LSPosed 按 META-INF/xposed/java_init.list 里的类名字符串加载入口类。
        # R8 若把它改名或裁剪，构建仍会成功，但模块会静默不加载——所以在 CI 里直接查 dex。
        python3 - <<'PY'
        import glob, sys, zipfile
        apk = sorted(glob.glob('app/build/outputs/apk/release/*.apk'))[0]
        with zipfile.ZipFile(apk) as z:
            dex = b''.join(z.read(n) for n in z.namelist()
                           if n.startswith('classes') and n.endswith('.dex'))
        ok = b'Lsumicya/fcmself/XposedMain;' in dex
        print(f'{apk}: 入口类 sumicya.fcmself.XposedMain '
              + ('已保留' if ok else '被 R8 改名或裁剪'))
        print(f'dex 合计 {len(dex)} 字节')
        sys.exit(0 if ok else 1)
        PY

    - name: Upload apks
      uses: actions/upload-artifact@v7
      with:
        name: fcmself-${{ env.VERSION_NAME }}
        path: |
          ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-${{ env.VERSION_NAME }}-unsigned.apk
          ${{ github.workspace }}/app/build/outputs/apk/debug/fcmself-${{ env.VERSION_NAME }}-debug-signed.apk

    - name: Dump build log tail on failure
      if: failure()
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail)'
          echo '```'
          tail -n 150 build.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Post build log tail to PR on failure
      if: failure() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        {
          echo '### Gradle build log (tail 120)'
          echo '```'
          tail -n 120 build.log
          echo '```'
        } > /tmp/build-log-tail.md
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file /tmp/build-log-tail.md
