# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m
# 并行 / 缓存 / 配置缓存（AGP 9 全部支持，缩短 CI 与本地构建时间）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# debug 变体也开 R8 裁剪（见 app/build.gradle.kts 注释），压掉 AGP 对此的已知提示
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED
