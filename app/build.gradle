apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "sumicya.fcmself"
    compileSdkVersion 36

    defaultConfig {
        applicationId "sumicya.fcmself"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 54
        versionName "dev"
    }

    buildTypes {
        debug {
            // debug 也走 R8：把没用到的那 90%+ kotlin-stdlib 裁掉，让测试包从 ~800KB 降到和 release 相当，
            // 同时保持默认 debug 签名（可直接安装），不再需要手动 apksigner。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // 正式发布用：R8 裁剪 + 未签名，需要时再本地签。
            // 入口类由 proguard-rules.pro 保留（LSPosed 按类名字符串加载）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        // MethodArgs.byName 依赖真实参数名（单元测试验证兜底路径），
        // Kotlin 编译同样需要保留参数名
        javaParameters = true
    }
    lint {
        checkReleaseBuilds = false
    }
    testOptions {
        // 单元测试里若碰到 android.jar 的桩方法，返回默认值而不是抛 "Stub!"
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // 只依赖 LSPosed 的 API（编译期），运行期由框架提供；
    // 界面与 androidx 依赖已随设置界面一起移除，APK 里只有本模块自己的类
    compileOnly 'io.github.libxposed:api:101.0.1'

    // 单元测试只覆盖不依赖 Android 的纯逻辑（参数下标解析），因此 JUnit 就够，
    // 不需要 Robolectric / androidx.test
    testImplementation 'junit:junit:4.13.2'
}

// MethodArgs.byName() 依赖真实参数名，单元测试要靠它验证兜底路径，
// 所以编译时保留参数名（对 release 产物无副作用，只是类文件略大）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
