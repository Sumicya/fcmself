apply plugin: 'com.android.application'

android {
    namespace = "sumicya.fcmself"
    compileSdkVersion 36

    defaultConfig {
        applicationId "sumicya.fcmself"
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 54
        versionName "dev"
    }

    buildTypes {
        release {
            // R8 只作用于 release；CI 产出的 debug APK 不混淆。
            // 入口类由 proguard-rules.pro 保留（LSPosed 按类名字符串加载）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds = false
    }
}

dependencies {
    // 只依赖 LSPosed 的 API（编译期），运行期由框架提供；
    // 界面与 androidx 依赖已随设置界面一起移除，APK 里只有本模块自己的类
    compileOnly 'io.github.libxposed:api:101.0.1'
}
