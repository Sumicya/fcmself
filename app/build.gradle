apply plugin: 'com.android.application'

android {
    namespace = "sumicya.fcmself"
    compileSdkVersion 36

    defaultConfig {
        applicationId "sumicya.fcmself"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 55
        versionName "0.8.0"
    }

    buildTypes {
        debug {
            // debug 也走 R8：把没用到的那 90%+ kotlin-stdlib 裁掉，
            // 同时保持默认 debug 签名（可直接安装），不再需要手动 apksigner。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // 正式发布用：R8 裁剪 + 未签名。
            // 入口类由 proguard-rules.pro 保留（LSPosed 按类名字符串加载）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds = false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// AGP 9 起 Kotlin 由 AGP 内置（built-in Kotlin），不再单独 apply kotlin-android。
// 原 kotlinOptions 迁移到 compilerOptions；jvmTarget 与 compileOptions 的 17 保持一致，
// javaParameters 保留（MethodArgs 兜底按参数名定位依赖 -java-parameters）。
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        javaParameters = true
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}
